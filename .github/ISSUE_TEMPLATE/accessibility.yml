name: Accessibility report
description: Report a keyboard, screen-reader, contrast, scaling, or other access barrier.
title: "[Accessibility]: "
labels: [accessibility]
body:
  - type: markdown
    attributes:
      value: Do not include private media URLs, account details, or clipboard contents.
  - type: input
    id: shell-version
    attributes:
      label: GNOME Shell version
    validations:
      required: true
  - type: input
    id: assistive-tech
    attributes:
      label: Assistive technology or relevant display setting
      description: For example, a screen reader, keyboard-only use, text scaling, or high contrast.
  - type: textarea
    id: barrier
    attributes:
      label: What was difficult or unavailable?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: What change would help?
