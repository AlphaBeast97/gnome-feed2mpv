    <rect x="36" y="30" width="56" height="74" rx="9" fill="#f4f1fa"/>
    <rect x="49" y="22" width="30" height="16" rx="5" fill="#8e83a8"/>
    <rect x="58" y="27" width="12" height="4" rx="2" fill="#26104a"/>
  </g>
  <!-- play -->
